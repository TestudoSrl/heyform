apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: heyform-backend-config
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health/ready
    port: 9157
  timeoutSec: 60
  connectionDraining:
    drainingTimeoutSec: 30
